name: trafficam_app
description: TrafficCam - Traffic Police Officer App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_generative_ai: ^0.4.0  # The official Google AI SDK
  # Backend
  supabase_flutter: ^2.3.0

  # State management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.2.0

  # Speech to text
  speech_to_text: ^7.0.0

  # Camera & Image
  image_picker: ^1.0.7
  camera: ^0.10.5+9

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # HTTP
  http: ^1.2.0
  dio: ^5.4.1

  # UI helpers
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  
  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.0
  uuid: ^4.3.3
  timeago: ^3.6.0
  google_fonts: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  generate: true

  #assets:
   # - assets/icons/